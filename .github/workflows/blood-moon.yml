name: Blood Moon CI

on:
  push:
    paths: ['games/blood-moon/**', 'games/blood-moon-ue/**', '.github/workflows/blood-moon.yml']
  pull_request:
    paths: ['games/blood-moon/**', 'games/blood-moon-ue/**', '.github/workflows/blood-moon.yml']

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/blood-moon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/blood-moon/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run build

  ue-rules:
    # Engine-free C++ (round/economy rules) is compiled and tested on every change; the rest needs Unreal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine-free C++ tests (warnings as errors, then ASan + UBSan)
        working-directory: games/blood-moon-ue
        run: |
          for t in match:BMMatch grid:BMGrid; do
            n=${t%%:*}; s=${t##*:}
            clang++ -std=c++17 -O2 -Wall -Wextra -Werror -ISource/BloodMoon Tools/${n}_selftest.cpp Source/BloodMoon/$s.cpp -o ${n}_test && ./${n}_test
            g++ -std=c++17 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -ISource/BloodMoon Tools/${n}_selftest.cpp Source/BloodMoon/$s.cpp -o ${n}_asan && ./${n}_asan
          done
